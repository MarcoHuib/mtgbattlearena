name: Deploy Release
run-name: "Release #${{ github.run_number }} · ${{ github.sha }}"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  changes:
    name: Release / Detect changes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      game_worker: ${{ steps.filter.outputs.game_worker }}
      import_worker: ${{ steps.filter.outputs.import_worker }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine affected deployables
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          frontend=false
          game_worker=false
          import_worker=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            frontend=true
            game_worker=true
            import_worker=true
          else
            while IFS= read -r -d '' file; do
              case "$file" in
                package.json|package-lock.json|.github/workflows/deploy-release.yml)
                  frontend=true
                  game_worker=true
                  import_worker=true
                  ;;
                tsconfig.json|tsconfig.base.json|tsconfig.tools.json|packages/*)
                  frontend=true
                  game_worker=true
                  ;;
                apps/web/*|scripts/write-runtime-config.mjs|firebase.json|.firebaserc)
                  frontend=true
                  ;;
                apps/game-worker/*)
                  game_worker=true
                  ;;
                apps/import-worker/*)
                  import_worker=true
                  ;;
              esac
            done < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA")
          fi

          any=false
          if [[ "$frontend" == true || "$game_worker" == true || "$import_worker" == true ]]; then
            any=true
          fi

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "game_worker=$game_worker" >> "$GITHUB_OUTPUT"
          echo "import_worker=$import_worker" >> "$GITHUB_OUTPUT"
          echo "any=$any" >> "$GITHUB_OUTPUT"

  validate:
    name: Release / Validate
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check frontend and shared packages
        if: needs.changes.outputs.frontend == 'true'
        run: |
          npx --no-install tsc -p packages/game-core/tsconfig.json --noEmit
          npx --no-install tsc -p packages/game-protocol/tsconfig.json --noEmit
          npx --no-install tsc -p apps/web/tsconfig.app.json --noEmit
          npx --no-install tsc -p apps/web/tsconfig.node.json --noEmit
      - name: Test shared packages
        if: needs.changes.outputs.frontend == 'true'
        run: npm run test:packages
      - name: Test frontend
        if: needs.changes.outputs.frontend == 'true'
        run: npm run test:web
      - name: Type-check game Worker
        if: needs.changes.outputs.game_worker == 'true'
        run: npm run worker:type-check
      - name: Test game Worker
        if: needs.changes.outputs.game_worker == 'true'
        run: npm run test:worker
      - name: Bundle Beta game Worker
        if: needs.changes.outputs.game_worker == 'true'
        run: npm run deploy:cloudflare:check:staging:game
      - name: Bundle Production game Worker
        if: needs.changes.outputs.game_worker == 'true'
        run: npm run deploy:cloudflare:check:game
      - name: Bundle Beta import Worker
        if: needs.changes.outputs.import_worker == 'true'
        run: npm run deploy:cloudflare:check:staging:import
      - name: Bundle Production import Worker
        if: needs.changes.outputs.import_worker == 'true'
        run: npm run deploy:cloudflare:check:import

  build-release:
    name: Release / Build frontend artifact
    needs:
      - changes
      - validate
    if: >-
      needs.changes.outputs.frontend == 'true' &&
      needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build environment-neutral PWA
        run: npm run build
      - name: Upload immutable frontend artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-release-${{ github.run_number }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 14

  beta-firebase:
    name: Beta / Firebase Hosting
    needs:
      - changes
      - validate
      - build-release
    if: >-
      always() &&
      needs.changes.outputs.frontend == 'true' &&
      needs.validate.result == 'success' &&
      needs.build-release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-release-${{ github.run_number }}
          path: apps/web/dist
      - name: Add Beta runtime configuration
        env:
          # Environment Variables from the active `staging` environment.
          APP_ENV: ${{ vars.APP_ENV }}
          IMPORT_API_URL: ${{ vars.IMPORT_API_URL }}
          ONLINE_API_URL: ${{ vars.ONLINE_API_URL }}
          ONLINE_SOCKET_URL: ${{ vars.ONLINE_SOCKET_URL }}
          RELEASE_VERSION: ${{ github.run_number }}
          # Repository Variables shared by Beta and Production.
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          RUNTIME_CONFIG_OUTPUT: apps/web/dist/runtime-config.js
        run: node scripts/write-runtime-config.mjs
      - name: Deploy fixed Beta Hosting site
        uses: FirebaseExtended/action-hosting-deploy@7c850a480ce753f4f06f010801fc5a43787740bb # v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MTGBATTLEARENA }}
          projectId: mtgbattlearena
          target: staging
          channelId: live
          entryPoint: .
          firebaseToolsVersion: 15.26.0

  beta-import-worker:
    name: Beta / Import Worker
    needs:
      - changes
      - validate
    if: >-
      needs.changes.outputs.import_worker == 'true' &&
      needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Deploy Beta import Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        env:
          RELEASE_VERSION: ${{ github.run_number }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.120.0
          workingDirectory: apps/import-worker
          command: deploy --env staging --config wrangler.toml
          packageManager: npm
          vars: RELEASE_VERSION

  beta-game-worker:
    name: Beta / Game Worker
    needs:
      - changes
      - validate
      - beta-import-worker
    if: >-
      always() &&
      needs.changes.outputs.game_worker == 'true' &&
      needs.validate.result == 'success' &&
      (needs.changes.outputs.import_worker != 'true' ||
      needs.beta-import-worker.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Deploy Beta game Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        env:
          RELEASE_VERSION: ${{ github.run_number }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.120.0
          workingDirectory: apps/game-worker
          command: deploy --env staging --config wrangler.toml
          packageManager: npm
          vars: RELEASE_VERSION

  beta-complete:
    name: Beta / Release complete
    needs:
      - changes
      - validate
      - build-release
      - beta-firebase
      - beta-import-worker
      - beta-game-worker
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every affected Beta deployment
        shell: bash
        env:
          FRONTEND_REQUIRED: ${{ needs.changes.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.beta-firebase.result }}
          IMPORT_REQUIRED: ${{ needs.changes.outputs.import_worker }}
          IMPORT_RESULT: ${{ needs.beta-import-worker.result }}
          GAME_REQUIRED: ${{ needs.changes.outputs.game_worker }}
          GAME_RESULT: ${{ needs.beta-game-worker.result }}
        run: |
          set -euo pipefail
          [[ "$FRONTEND_REQUIRED" != true || "$FRONTEND_RESULT" == success ]]
          [[ "$IMPORT_REQUIRED" != true || "$IMPORT_RESULT" == success ]]
          [[ "$GAME_REQUIRED" != true || "$GAME_RESULT" == success ]]

  publish-beta-release:
    name: Beta / Publish release metadata
    needs:
      - changes
      - beta-complete
    if: >-
      needs.changes.outputs.any == 'true' &&
      needs.beta-complete.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Publish successful Beta release number
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.run_number }}
        run: |
          set -euo pipefail
          jq -n \
            --arg ref "$GITHUB_SHA" \
            --arg description "Build #$RELEASE_VERSION" \
            '{ref: $ref, task: "release-metadata", environment: "staging", description: $description, auto_merge: false, required_contexts: [], transient_environment: false, production_environment: false}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq '.id' \
            > deployment-id.txt
          deployment_id="$(<deployment-id.txt)"
          jq -n \
            --arg description "Build #$RELEASE_VERSION" \
            --arg log_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state: "success", description: $description, environment_url: "https://beta.mtgbattlearena.nl", log_url: $log_url}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" --input -

  production-firebase:
    name: Production / Firebase Hosting
    needs:
      - changes
      - build-release
      - beta-complete
    if: >-
      always() &&
      needs.changes.outputs.frontend == 'true' &&
      needs.build-release.result == 'success' &&
      needs.beta-complete.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download the same release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-release-${{ github.run_number }}
          path: apps/web/dist
      - name: Add Production runtime configuration
        env:
          # Environment Variables from the active `production` environment.
          APP_ENV: ${{ vars.APP_ENV }}
          IMPORT_API_URL: ${{ vars.IMPORT_API_URL }}
          ONLINE_API_URL: ${{ vars.ONLINE_API_URL }}
          ONLINE_SOCKET_URL: ${{ vars.ONLINE_SOCKET_URL }}
          RELEASE_VERSION: ${{ github.run_number }}
          # Repository Variables shared by Beta and Production.
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          RUNTIME_CONFIG_OUTPUT: apps/web/dist/runtime-config.js
        run: node scripts/write-runtime-config.mjs
      - name: Deploy fixed Production Hosting site
        uses: FirebaseExtended/action-hosting-deploy@7c850a480ce753f4f06f010801fc5a43787740bb # v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MTGBATTLEARENA }}
          projectId: mtgbattlearena
          target: production
          channelId: live
          entryPoint: .
          firebaseToolsVersion: 15.26.0

  production-import-worker:
    name: Production / Import Worker
    needs:
      - changes
      - beta-complete
    if: >-
      needs.changes.outputs.import_worker == 'true' &&
      needs.beta-complete.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Deploy Production import Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        env:
          RELEASE_VERSION: ${{ github.run_number }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.120.0
          workingDirectory: apps/import-worker
          command: deploy --config wrangler.toml
          packageManager: npm
          vars: RELEASE_VERSION

  production-game-worker:
    name: Production / Game Worker
    needs:
      - changes
      - beta-complete
      - production-import-worker
    if: >-
      always() &&
      needs.changes.outputs.game_worker == 'true' &&
      needs.beta-complete.result == 'success' &&
      (needs.changes.outputs.import_worker != 'true' ||
      needs.production-import-worker.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Deploy Production game Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        env:
          RELEASE_VERSION: ${{ github.run_number }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.120.0
          workingDirectory: apps/game-worker
          command: deploy --config wrangler.toml
          packageManager: npm
          vars: RELEASE_VERSION

  production-complete:
    name: Production / Release complete
    needs:
      - changes
      - beta-complete
      - production-firebase
      - production-import-worker
      - production-game-worker
    if: always() && needs.beta-complete.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every affected Production deployment
        shell: bash
        env:
          FRONTEND_REQUIRED: ${{ needs.changes.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.production-firebase.result }}
          IMPORT_REQUIRED: ${{ needs.changes.outputs.import_worker }}
          IMPORT_RESULT: ${{ needs.production-import-worker.result }}
          GAME_REQUIRED: ${{ needs.changes.outputs.game_worker }}
          GAME_RESULT: ${{ needs.production-game-worker.result }}
        run: |
          set -euo pipefail
          [[ "$FRONTEND_REQUIRED" != true || "$FRONTEND_RESULT" == success ]]
          [[ "$IMPORT_REQUIRED" != true || "$IMPORT_RESULT" == success ]]
          [[ "$GAME_REQUIRED" != true || "$GAME_RESULT" == success ]]

  publish-production-release:
    name: Production / Publish release metadata
    needs:
      - changes
      - production-complete
    if: >-
      needs.changes.outputs.any == 'true' &&
      needs.production-complete.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Publish successful Production release number
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.run_number }}
        run: |
          set -euo pipefail
          jq -n \
            --arg ref "$GITHUB_SHA" \
            --arg description "Build #$RELEASE_VERSION" \
            '{ref: $ref, task: "release-metadata", environment: "production", description: $description, auto_merge: false, required_contexts: [], transient_environment: false, production_environment: true}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq '.id' \
            > deployment-id.txt
          deployment_id="$(<deployment-id.txt)"
          jq -n \
            --arg description "Build #$RELEASE_VERSION" \
            --arg log_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state: "success", description: $description, environment_url: "https://mtgbattlearena.nl", log_url: $log_url}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" --input -
