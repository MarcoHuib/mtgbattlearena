name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      game_worker: ${{ steps.filter.outputs.game_worker }}
      import_worker: ${{ steps.filter.outputs.import_worker }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine affected projects
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          frontend=false
          game_worker=false
          import_worker=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            frontend=true
            game_worker=true
            import_worker=true
          else
            while IFS= read -r -d '' file; do
              case "$file" in
                package.json|package-lock.json|eslint.config.js|.github/workflows/*)
                  frontend=true
                  game_worker=true
                  import_worker=true
                  ;;
                tsconfig.json|tsconfig.base.json|tsconfig.tools.json|packages/*)
                  frontend=true
                  game_worker=true
                  ;;
                apps/web/*|firebase.json|.firebaserc)
                  frontend=true
                  ;;
                apps/game-worker/*)
                  game_worker=true
                  ;;
                apps/import-worker/*)
                  import_worker=true
                  ;;
              esac
            done < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA")
          fi

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "game_worker=$game_worker" >> "$GITHUB_OUTPUT"
          echo "import_worker=$import_worker" >> "$GITHUB_OUTPUT"

  frontend:
    name: CI / Frontend
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1
      - name: No frontend changes
        if: >-
          needs.changes.result == 'success' &&
          needs.changes.outputs.frontend != 'true'
        run: echo "Frontend validation is not required for this change."
      - name: Check out repository
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        if: needs.changes.outputs.frontend == 'true'
        run: npm ci
      - name: Lint
        if: needs.changes.outputs.frontend == 'true'
        run: npm run lint
      - name: Verify generated GraphQL client
        if: needs.changes.outputs.frontend == 'true'
        run: npm run graphql:codegen:check
      - name: Type-check frontend and shared packages
        if: needs.changes.outputs.frontend == 'true'
        run: |
          npx --no-install tsc -p packages/game-core/tsconfig.json --noEmit
          npx --no-install tsc -p packages/game-protocol/tsconfig.json --noEmit
          npx --no-install tsc -p apps/web/tsconfig.app.json --noEmit
          npx --no-install tsc -p apps/web/tsconfig.node.json --noEmit
      - name: Test shared packages
        if: needs.changes.outputs.frontend == 'true'
        run: npm run test:packages
      - name: Test frontend
        if: needs.changes.outputs.frontend == 'true'
        run: npm run test:web
      - name: Build production PWA
        if: needs.changes.outputs.frontend == 'true'
        run: npm run build --workspace @mtg/web

  game-worker:
    name: CI / Game Worker
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1
      - name: No game Worker changes
        if: >-
          needs.changes.result == 'success' &&
          needs.changes.outputs.game_worker != 'true'
        run: echo "Game Worker validation is not required for this change."
      - name: Check out repository
        if: needs.changes.outputs.game_worker == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        if: needs.changes.outputs.game_worker == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        if: needs.changes.outputs.game_worker == 'true'
        run: npm ci
      - name: Lint
        if: needs.changes.outputs.game_worker == 'true'
        run: npm run lint
      - name: Type-check game Worker
        if: needs.changes.outputs.game_worker == 'true'
        run: npm run worker:type-check
      - name: Test game Worker
        if: needs.changes.outputs.game_worker == 'true'
        run: npm run test:worker
      - name: Bundle game Worker without deploying
        if: needs.changes.outputs.game_worker == 'true'
        run: npm run deploy:cloudflare:check:game

  import-worker:
    name: CI / Import Worker
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1
      - name: No import Worker changes
        if: >-
          needs.changes.result == 'success' &&
          needs.changes.outputs.import_worker != 'true'
        run: echo "Import Worker validation is not required for this change."
      - name: Check out repository
        if: needs.changes.outputs.import_worker == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        if: needs.changes.outputs.import_worker == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        if: needs.changes.outputs.import_worker == 'true'
        run: npm ci
      - name: Validate import Worker
        if: needs.changes.outputs.import_worker == 'true'
        run: npm run validate:import-worker

  dependency-review:
    name: CI / Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
