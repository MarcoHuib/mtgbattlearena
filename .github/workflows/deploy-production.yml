name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  changes:
    name: Detect production changes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      game_worker: ${{ steps.filter.outputs.game_worker }}
      import_worker: ${{ steps.filter.outputs.import_worker }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine affected deployables
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          frontend=false
          game_worker=false
          import_worker=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            frontend=true
            game_worker=true
            import_worker=true
          else
            while IFS= read -r -d '' file; do
              case "$file" in
                package.json|package-lock.json)
                  frontend=true
                  game_worker=true
                  import_worker=true
                  ;;
                tsconfig.json|tsconfig.base.json|tsconfig.tools.json|packages/*)
                  frontend=true
                  game_worker=true
                  ;;
                apps/web/*|firebase.json|.firebaserc)
                  frontend=true
                  ;;
                apps/game-worker/*)
                  game_worker=true
                  ;;
                apps/import-worker/*)
                  import_worker=true
                  ;;
              esac
            done < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA")
          fi

          any=false
          if [[ "$frontend" == true || "$game_worker" == true || "$import_worker" == true ]]; then
            any=true
          fi

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "game_worker=$game_worker" >> "$GITHUB_OUTPUT"
          echo "import_worker=$import_worker" >> "$GITHUB_OUTPUT"
          echo "any=$any" >> "$GITHUB_OUTPUT"

  validate:
    name: Production / Validate
    needs: changes
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check frontend and shared packages
        if: needs.changes.outputs.frontend == 'true'
        run: |
          npx --no-install tsc -p packages/game-core/tsconfig.json --noEmit
          npx --no-install tsc -p packages/game-protocol/tsconfig.json --noEmit
          npx --no-install tsc -p apps/web/tsconfig.app.json --noEmit
          npx --no-install tsc -p apps/web/tsconfig.node.json --noEmit
      - name: Test shared packages
        if: needs.changes.outputs.frontend == 'true'
        run: npm run test:packages
      - name: Test frontend
        if: needs.changes.outputs.frontend == 'true'
        run: npm run test:web
      - name: Build production PWA
        if: needs.changes.outputs.frontend == 'true'
        run: npm run build --workspace @mtg/web
      - name: Type-check game Worker
        if: needs.changes.outputs.game_worker == 'true'
        run: npm run worker:type-check
      - name: Test game Worker
        if: needs.changes.outputs.game_worker == 'true'
        run: npm run test:worker
      - name: Bundle game Worker without deploying
        if: needs.changes.outputs.game_worker == 'true'
        run: npm run deploy:cloudflare:check:game
      - name: Bundle import Worker without deploying
        if: needs.changes.outputs.import_worker == 'true'
        run: npm run deploy:cloudflare:check:import

  firebase-hosting:
    name: Production / Firebase Hosting
    needs:
      - changes
      - validate
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.frontend == 'true' &&
      needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build production PWA
        run: npm run build --workspace @mtg/web
      - name: Deploy Firebase Hosting live channel
        uses: FirebaseExtended/action-hosting-deploy@7c850a480ce753f4f06f010801fc5a43787740bb # v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MTGBATTLEARENA }}
          channelId: live
          entryPoint: .
          firebaseToolsVersion: 15.26.0

  import-worker:
    name: Production / Import Worker
    needs:
      - changes
      - validate
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.import_worker == 'true' &&
      needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Deploy import Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.120.0
          workingDirectory: apps/import-worker
          command: deploy --config wrangler.toml
          packageManager: npm

  game-worker:
    name: Production / Game Worker
    needs:
      - changes
      - validate
      - import-worker
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.game_worker == 'true' &&
      needs.validate.result == 'success' &&
      (needs.changes.outputs.import_worker != 'true' ||
      needs.import-worker.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Deploy game Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.120.0
          workingDirectory: apps/game-worker
          command: deploy --config wrangler.toml
          packageManager: npm
