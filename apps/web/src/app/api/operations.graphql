query PublicLobbies {
  publicLobbies {
    id
    code
    title
    hostDisplayName
    format
    visibility
    status
    playerCount
    maxPlayers
    viewerRole
  }
}

query Lobby($id: ID!) {
  lobby(id: $id) {
    lobby {
      code
      title
      hostDisplayName
      status
      maxPlayers
      viewerRole
    }
    participants {
      displayName
      role
      seatNumber
      isHost
      isViewer
      deckReady
      deckName
    }
  }
}

query DeckFromUrl($url: String!, $sourceHash: String) {
  deckFromUrl(url: $url, sourceHash: $sourceHash) {
    cacheStatus
    deckId
    revisionId
    deck {
      source
      sourceId
      sourceUrl
      sourceHash
      name
      format
      importedAt
      cards {
        definitionId
        quantity
        isCommander
      }
      definitions {
        id
        name
        scryfallId
        oracleId
        layout
        faces {
          name
          typeLine
          oracleText
          imageUrl
        }
        imageRefs {
          assetKey
          faceIndex
          variant
          url
        }
        oracleText
        typeLine
        manaValue
        token {
          kind
          name
          power
          toughness
          source
        }
      }
    }
  }
}

mutation CreateLobby($input: CreateLobbyInput!) {
  createLobby(input: $input) {
    id
    status
  }
}

mutation JoinLobby($input: JoinLobbyInput!) {
  joinLobby(input: $input) {
    gameId
    lobby {
      status
    }
  }
}

mutation DeleteLobby($id: ID!) {
  deleteLobby(id: $id)
}
mutation AbortGame($gameId: ID!) {
  abortGame(gameId: $gameId)
}
mutation RegisterDeck($gameId: ID!, $deck: RegisterDeckInput!) {
  registerDeck(gameId: $gameId, deck: $deck)
}
mutation StartGame($gameId: ID!) {
  startGame(gameId: $gameId)
}
mutation CreateSocketTicket($gameId: ID!) {
  createSocketTicket(gameId: $gameId) {
    ticket
  }
}
