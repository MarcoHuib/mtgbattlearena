query PublicLobbies {
  publicLobbies {
    id
    code
    title
    hostDisplayName
    format
    visibility
    status
    playerCount
    maxPlayers
    viewerRole
  }
}

query Lobby($id: ID!) {
  lobby(id: $id) {
    lobby {
      code
      title
      hostDisplayName
      status
      maxPlayers
      viewerRole
    }
    participants {
      displayName
      role
      seatNumber
      isHost
      isViewer
      deckReady
      deckName
    }
  }
}

query DeckFromUrl($url: String!) {
  deckFromUrl(url: $url) {
    cacheStatus
    deckId
    revisionId
    deck {
      source
      sourceId
      sourceUrl
      name
      format
      importedAt
      cards {
        definitionId
        quantity
        isCommander
      }
      definitions {
        id
        name
        oracleId
        layout
        faces {
          name
          typeLine
          oracleText
        }
        imageRefs {
          resolver
          imageId
          faceIndex
          variant
        }
        oracleText
        typeLine
        manaValue
        token {
          kind
          name
          power
          toughness
          source
        }
      }
    }
  }
}

mutation CreateCloudDeck($url: String!) {
  createCloudDeck(url: $url) {
    deckKey
    provider
    externalDeckKey
    sourceUrl
    name
    format
    commanderSummary
    cardCount
    createdAt
    updatedAt
  }
}

mutation UpdateCloudDeck($deckKey: ID!) {
  updateCloudDeck(deckKey: $deckKey) {
    deckKey
    provider
    externalDeckKey
    sourceUrl
    name
    format
    commanderSummary
    cardCount
    createdAt
    updatedAt
  }
}

mutation DeleteCloudDeck($deckKey: ID!) {
  deleteCloudDeck(deckKey: $deckKey)
}

mutation CreateLobby($input: CreateLobbyInput!) {
  createLobby(input: $input) {
    id
    status
  }
}

mutation JoinLobby($input: JoinLobbyInput!) {
  joinLobby(input: $input) {
    gameId
    lobby {
      status
    }
  }
}

mutation DeleteLobby($id: ID!) {
  deleteLobby(id: $id)
}
mutation AbortGame($gameId: ID!) {
  abortGame(gameId: $gameId)
}
mutation RegisterDeck($gameId: ID!, $deckKey: ID!) {
  registerDeck(gameId: $gameId, deckKey: $deckKey)
}
mutation StartGame($gameId: ID!) {
  startGame(gameId: $gameId)
}
mutation CreateSocketTicket($gameId: ID!) {
  createSocketTicket(gameId: $gameId) {
    ticket
  }
}
