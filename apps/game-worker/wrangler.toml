name = "mtg-battle-mode-online"
main = "src/index.ts"
compatibility_date = "2026-07-01"
tsconfig = "tsconfig.json"

[[routes]]
pattern = "api.mtgbattlearena.nl"
custom_domain = true

[[routes]]
pattern = "ws.mtgbattlearena.nl"
custom_domain = true

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[vars]
FIREBASE_PROJECT_ID = "mtgbattlearena"
FIREBASE_PROJECT_NUMBER = "445284154827"
FIREBASE_ALLOWED_APP_IDS = "1:445284154827:web:0058a13d000600d7418a4e"
APP_CHECK_ENFORCEMENT = "monitor"
APP_ENV = "production"
RELEASE_VERSION = "local"
ALLOWED_ORIGIN = "http://localhost:5173,https://mtgbattlearena.nl,https://www.mtgbattlearena.nl,https://mtgbattlearena.web.app,https://mtgbattlearena.firebaseapp.com"

[[services]]
binding = "IMPORT"
service = "mtg-battle-mode-import"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "LobbyDurableObject"

[[durable_objects.bindings]]
name = "GAMES"
class_name = "GameDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameDurableObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LobbyDurableObject"]

# Firebase private keys are neither required nor supported here.

# Staging is een afzonderlijke Worker deployment. De environment-specifieke
# bindings hieronder zijn bewust herhaald omdat vars, services en Durable
# Objects niet door Wrangler environments worden geërfd.
[env.staging]
name = "mtg-battle-mode-online-staging"

[[env.staging.routes]]
pattern = "api.beta.mtgbattlearena.nl"
custom_domain = true

[[env.staging.routes]]
pattern = "ws.beta.mtgbattlearena.nl"
custom_domain = true

[env.staging.vars]
FIREBASE_PROJECT_ID = "mtgbattlearena"
FIREBASE_PROJECT_NUMBER = "445284154827"
FIREBASE_ALLOWED_APP_IDS = "1:445284154827:web:0058a13d000600d7418a4e"
APP_CHECK_ENFORCEMENT = "enforce"
APP_ENV = "staging"
RELEASE_VERSION = "local"
ALLOWED_ORIGIN = "http://localhost:5173,https://beta.mtgbattlearena.nl,https://mtgbattlearena-beta.web.app,https://mtgbattlearena-beta.firebaseapp.com"

[[env.staging.services]]
binding = "IMPORT"
service = "mtg-battle-mode-import-staging"

[[env.staging.durable_objects.bindings]]
name = "LOBBY"
class_name = "LobbyDurableObject"

[[env.staging.durable_objects.bindings]]
name = "GAMES"
class_name = "GameDurableObject"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["GameDurableObject"]

[[env.staging.migrations]]
tag = "v2"
new_sqlite_classes = ["LobbyDurableObject"]
